---

# ========================================================================

# V5 THREAT HUNT CYBER RANGE WORKER PROVISIONING PROFILE (Windows)

# ========================================================================


- name: Create Range Engine Workspace Layout

  win_file:

    path: 'C:\ProgramData\RangeEngine\Queue'

    state: directory


- name: Deploy Campaign Worker Payload

  win_copy:

    src: files/Run-CampaignWorker.ps1

    dest: 'C:\ProgramData\RangeEngine\Queue\Run-CampaignWorker.ps1'


- name: Provision Scheduled Task for Persistent Worker Execution

  win_scheduled_task:

    name: 'V5_Threat_Hunt_Worker'

    description: 'Executes curated adversary attack simulations and records telemetry.'

    actions:

      - path: powershell.exe

        arguments: '-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -Command "& { Set-Location C:\ProgramData\RangeEngine\Queue; .\Run-CampaignWorker.ps1 }"'

    triggers:

      - type: boot

    username: 'SYSTEM'

    state: present

    enabled: yes


- name: Force Start Adversary Emulation Worker Thread Immediately

  win_command: schtasks.exe /run /tn "V5_Threat_Hunt_Worker"
