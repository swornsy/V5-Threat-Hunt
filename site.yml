---
# ========================================================================
# V5 THREAT HUNT CYBER RANGE MASTER ORCHESTRATION PROFILE (site.yml)
# ========================================================================

- name: V5 Threat Hunt Adversary Emulation Engine (Testable Build)
  hosts: windows
  gather_facts: yes

  vars:
    test_single_phase: false
    test_phase_name: "execution"
    test_single_technique: false
    test_technique_id: "T1059.001"
    sim_duration: "72h"  # overridden by start_simulation.sh

  pre_tasks:

    # ----------------------------------------------------------
    # Global Campaign Start Timestamp
    # ----------------------------------------------------------
    - name: Initialize campaign start timestamp
      set_fact:
        campaign_start_ts: "{{ lookup('pipe', 'date +%s') | int }}"
      delegate_to: localhost
      run_once: true
      tags: always

    # ----------------------------------------------------------
    # Strict ATT&CK Phase Ordering
    # ----------------------------------------------------------
    - name: Initialize Global Cyber Range ATT&CK Phases
      set_fact:
        valid_phases:
          - reconnaissance
          - initial-access
          - execution
          - persistence
          - privilege-escalation
          - defense-evasion
          - credential-access
          - discovery
          - lateral-movement
          - collection
          - command-and-control
          - exfiltration
          - impact
      tags: always

    # ----------------------------------------------------------
    # Load ATT&CK Matrix
    # ----------------------------------------------------------
    - name: Load attack matrix
      include_vars:
        file: "vars/mitre_attack_matrix.yml"
        name: raw_matrix
      delegate_to: localhost
      run_once: true
      tags: always

    # ----------------------------------------------------------
    # Flatten Actor Techniques (Hardened Scoping & Mutators)
    # ----------------------------------------------------------
    - name: Parse and Flatten Target Attack Sequence Array
      set_fact:
        attack_sequence_full: >-
          {%- set target_actor = selected_actor_id | default('G0016') -%}
          {%- set actor_data = raw_matrix['attack_matrix'][target_actor] | default({}) -%}
          {%- set ns = namespace(processed_list=[]) -%}
          
          {%- for phase_name in valid_phases -%}
            {%- set actions = actor_data.get(phase_name, []) -%}
            {%- if actions is iterable and actions is not string and actions is not mapping -%}
              {%- for action in actions -%}
                {%- if action is mapping and action.technique is defined -%}
                  {%- set action_copy = action | combine({'phase': phase_name}) -%}
                  {%- set ns.processed_list = ns.processed_list + [action_copy] -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.processed_list | to_json | trim }}
      tags: always

    - name: Cast actor sequence to YAML
      set_fact:
        attack_sequence_full: "{{ attack_sequence_full | from_json }}"
      tags: always

    # ----------------------------------------------------------
    # Build Phase-Indexed Actor Technique Map
    # ----------------------------------------------------------
    - name: Build phase-indexed actor technique map
      set_fact:
        actor_phase_map: >-
          {%- set raw_groups = attack_sequence_full | groupby('phase') -%}
          {%- set ns = namespace(dict_pairs=[]) -%}
          {%- for g in raw_groups -%}
            {%- set ns.dict_pairs = ns.dict_pairs + [{'key': g.grouper, 'value': g.list}] -%}
          {%- endfor -%}
          {{ ns.dict_pairs | items2dict | to_json | trim }}
      tags: always

    - name: Cast phase-indexed map to dict object
      set_fact:
        actor_phase_map: "{{ actor_phase_map | from_json }}"
      tags: always

    # ----------------------------------------------------------
    # Build Global Fallback Technique Pool
    # ----------------------------------------------------------
    - name: Build global fallback technique pool
      set_fact:
        global_pool: "{{ raw_matrix['all_techniques'] | default([]) }}"
      tags: always

    # ----------------------------------------------------------
    # Curate 1 Technique Per Phase (Actor Preferred)
    # ----------------------------------------------------------
    - name: Select 1 technique per phase (actor preferred, fallback allowed)
      set_fact:
        curated_attack_sequence: >-
          {%- set ns = namespace(result=[]) -%}
          {%- for phase in valid_phases -%}
            {%- set actor_list = actor_phase_map.get(phase, []) -%}
            {%- if actor_list | length > 0 -%}
              {%- set ns.result = ns.result + [actor_list | random] -%}
            {%- else -%}
              {%- set fallback = (global_pool | random) -%}
              {%- if fallback is mapping -%}
                {%- set fallback_mod = fallback | combine({'phase': phase}) -%}
                {%- set ns.result = ns.result + [fallback_mod] -%}
              {%- endif -... -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.result | to_json | trim }}
      tags: always

    - name: Cast curated sequence to YAML
      set_fact:
        attack_sequence: "{{ curated_attack_sequence | from_json }}"
      tags: always

    # ----------------------------------------------------------
    # Extract Actor Technique List (Uppercase)
    # ----------------------------------------------------------
    - name: Extract dynamic technique list for actor guard
      set_fact:
        selected_actor_techniques: >-
          {{
            attack_sequence
            | map(attribute='technique')
            | map('string')
            | map('upper')
            | list
          }}
      tags: always

    # ----------------------------------------------------------
    # Host Randomization
    # ----------------------------------------------------------
    - name: Establish Patient Zero and Random Downstream Targets
      set_fact:
        shuffled_hosts: "{{ groups['windows'] | shuffle }}"
      delegate_to: localhost
      delegate_facts: true
      run_once: true
      tags: always

    - name: Assign Campaign Hosts and Set Group Limits
      set_fact:
        patient_zero_host: "{{ hostvars['localhost']['shuffled_hosts'] | first }}"
        downstream_count: "{{ range(0, 3) | random }}"
      delegate_to: localhost
      delegate_facts: true
      run_once: true
      tags: always

    - name: Finalize Allowed Lateral Target Pool
      set_fact:
        allowed_downstream_targets: "{{ hostvars['localhost']['shuffled_hosts'][1:(1 + hostvars['localhost']['downstream_count'] | int)] }}"
        compromised_hosts: ["{{ hostvars['localhost']['patient_zero_host'] }}"]
      delegate_to: localhost
      delegate_facts: true
      run_once: true
      tags: always

    - name: DEBUG Campaign Initialization Layout
      debug:
        msg: >-
          Patient Zero Host = {{ hostvars['localhost']['patient_zero_host'] }}
          Number of Downstream Allowed = {{ hostvars['localhost']['downstream_count'] }}
          Allowed Downstream Targets = {{ hostvars['localhost']['allowed_downstream_targets'] }}
      delegate_to: localhost
      run_once: true
      tags: always

  roles:
    - users
    - normal_activity
    - engine

  post_tasks:

    - name: Maintain Lab Environment Baseline Window
      pause:
        minutes: "{{
          0 if sim_duration == 'test' else
          30 if sim_duration == '30m' else
          1440 if sim_duration == '24h' else
          4320 if sim_duration == '72h'
        }}"
      when: sim_duration != 'test'
      delegate_to: localhost
      run_once: true
      tags: always

    - name: Trigger Post-Campaign Cyber Range Evacuation
      include_tasks: roles/engine/tasks/cleanup.yml
      tags: always