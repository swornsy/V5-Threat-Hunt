---
# ========================================================================
# ENGINE ROLE — CROSS-PLATFORM MAIN (HARDENED INTEGRATION)
# ========================================================================
# Assumptions:
# - attack_sequence is curated in site.yml (host-aware)
# - campaign_start_ts is set in site.yml
# - sim_duration is provided (or defaults)
# - Workers run as compromised user (user-scoped state)
# - Config/manifest are system-scoped so any user can read them
# ========================================================================

# ------------------------------------------------------------------------
# Ensure system-scoped config + queue directories exist
# ------------------------------------------------------------------------

- name: Ensure shared config/queue directories exist (Windows)
  ansible.windows.win_file:
    path: "{{ item }}"
    state: directory
  loop:
    - C:\ProgramData\RangeEngine\Config
    - C:\ProgramData\RangeEngine\Queue
  when: ansible_os_family == 'Windows'

- name: Ensure shared config/queue directories exist (Linux)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/range_engine/config
    - /etc/range_engine/queue
  become: true
  when: ansible_system == 'Linux'

# ------------------------------------------------------------------------
# Write campaign manifest + config (system-scoped)
# ------------------------------------------------------------------------

- name: Write campaign manifest (Windows)
  ansible.windows.win_copy:
    dest: C:\ProgramData\RangeEngine\Config\campaign_manifest.json
    content: "{{ attack_sequence | to_json }}"
  when: ansible_os_family == 'Windows'

- name: Write campaign config (Windows)
  ansible.windows.win_copy:
    dest: C:\ProgramData\RangeEngine\Config\campaign_config.json
    content: >
      {{
        {
          "sim_duration": sim_duration | default("72h"),
          "step_count": attack_sequence | length,
          "campaign_start": campaign_start_ts | int
        } | to_json
      }}
  when: ansible_os_family == 'Windows'

- name: Write campaign manifest (Linux)
  ansible.builtin.copy:
    dest: /etc/range_engine/config/campaign_manifest.json
    content: "{{ attack_sequence | to_json }}"
    mode: '0644'
  become: true
  when: ansible_system == 'Linux'

- name: Write campaign config (Linux)
  ansible.builtin.copy:
    dest: /etc/range_engine/config/campaign_config.json
    content: >
      {{
        {
          "sim_duration": sim_duration | default("72h"),
          "step_count": attack_sequence | length,
          "campaign_start": campaign_start_ts | int
        } | to_json
      }}
    mode: '0644'
  become: true
  when: ansible_system == 'Linux'

# ------------------------------------------------------------------------
# Provision + launch platform-specific workers
# ------------------------------------------------------------------------

- name: Provision and launch Windows worker
  include_tasks: provision_worker_windows.yml
  when: ansible_os_family == 'Windows'

- name: Provision and launch Linux worker
  include_tasks: provision_worker_linux.yml
  when: ansible_system == 'Linux'

# ------------------------------------------------------------------------
# Optional inline engine execution (legacy mode alignment fixed)
# ------------------------------------------------------------------------

- name: Execute curated attack sequence inline (optional)
  include_tasks: execute_technique.yml
  loop: "{{ attack_sequence }}"
  # Aligned loop_var back to 'item' to prevent variable translation breakage inside execute_technique.yml
  loop_control:
    loop_var: item
  when: run_engine_inline | default(false)

# ------------------------------------------------------------------------
# Final handoff
# --------------------------------=======================================

- name: Engine handoff complete
  debug:
    msg: "Persistent worker launched for {{ inventory_hostname }}. Ansible handoff complete."